name: Build website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the website
        run: npm run build
        env:
          VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}

      - name: Commit generated website files
        run: |
          if test -z "$(git status --porcelain -- docs)"; then
            echo "No website changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all docs
          git commit -m "chore: rebuild website"
          git push
