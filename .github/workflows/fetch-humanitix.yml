name: Refresh Humanitix events

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Humanitix API data
        uses: JamesIves/fetch-api-data-action@v2
        with:
          endpoint: https://api.humanitix.com/v1/events?page=1
          configuration: |
            {
              "method": "GET",
              "headers": {
                "x-api-key": "${{ secrets.HUMANITIX_API_KEY }}"
              }
            }
          save-name: humanitix
          set-output: false

      - name: Update the event snapshot
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: fetch-api-data-action
          target-folder: data
